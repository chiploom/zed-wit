name: CD

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Release scope (lsp or extension)
        required: true
        default: lsp
        type: choice
        options:
          - lsp
          - extension
      tag:
        description: vX.Y.Z for LSP or v-extension-X.Y.Z for the Zed extension
        required: true
        type: string
      publish:
        description: Create the protected tag and GitHub release after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTUP_AUTO_INSTALL: "0"

concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      tag: ${{ steps.validate.outputs.tag }}
      scope: ${{ steps.validate.outputs.scope }}
      title: ${{ steps.validate.outputs.title }}
      notes: ${{ steps.validate.outputs.notes }}
      server_tag: ${{ steps.validate.outputs.server_tag }}
    steps:
      - name: Require default branch dispatch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::CD must be dispatched from $DEFAULT_BRANCH"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: quality
          cache-bin: false
          save-if: false

      - name: Enforce repository automation policy
        run: |
          cargo xtask check-no-python
          cargo xtask check-dependencies

      - name: Validate release identity and scope
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SCOPE: ${{ inputs.scope }}
        run: cargo xtask validate-release --tag "$RELEASE_TAG" --scope "$RELEASE_SCOPE"

      - name: Require unused tag or matching resumable draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
          RELEASE_SHA: ${{ steps.validate.outputs.sha }}
          RELEASE_TITLE: ${{ steps.validate.outputs.title }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          if [ "$PUBLISH" != "true" ]; then
            echo "::error::Release tag $RELEASE_TAG already exists"
            exit 1
          fi

          remote_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          object_type=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          if [ "$object_type" = "tag" ]; then
            remote_sha=$(gh api "repos/$GH_REPO/git/tags/$remote_sha" --jq '.object.sha')
          fi
          if [ "$remote_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Release tag $RELEASE_TAG resolves to $remote_sha instead of $RELEASE_SHA"
            exit 1
          fi

          if draft_json=$(gh release view "$RELEASE_TAG" --json isDraft,name 2>/dev/null); then
            if [ "$(jq -r '.isDraft' <<<"$draft_json")" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published"
              exit 1
            fi
            if [ "$(jq -r '.name' <<<"$draft_json")" != "$RELEASE_TITLE" ]; then
              echo "::error::Draft $RELEASE_TAG has a different release scope/title"
              exit 1
            fi
          fi

      - name: Require scoped user-facing release notes
        env:
          RELEASE_NOTES: ${{ steps.validate.outputs.notes }}
        run: |
          set -euo pipefail
          if [ ! -s "$RELEASE_NOTES" ]; then
            echo "::error::Missing nonempty release notes: $RELEASE_NOTES"
            exit 1
          fi

      - name: Require published immutable LSP dependency
        if: ${{ inputs.scope == 'extension' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVER_TAG: ${{ steps.validate.outputs.server_tag }}
        run: |
          set -euo pipefail

          release_json=$(gh api "repos/$GH_REPO/releases/tags/$SERVER_TAG")
          if [ "$(jq -r '.draft' <<<"$release_json")" != "false" ]; then
            echo "::error::Required LSP release $SERVER_TAG is not published"
            exit 1
          fi
          if [ "$(jq -r '.prerelease' <<<"$release_json")" != "false" ]; then
            echo "::error::Required LSP release $SERVER_TAG is a prerelease"
            exit 1
          fi
          if [ "$(jq -r '.immutable' <<<"$release_json")" != "true" ]; then
            echo "::error::Required LSP release $SERVER_TAG is not immutable"
            exit 1
          fi

          assets=$(jq -r '.assets[].name' <<<"$release_json")
          for asset in \
            wit-language-server-aarch64-apple-darwin \
            wit-language-server-x86_64-apple-darwin \
            wit-language-server-aarch64-unknown-linux-gnu \
            wit-language-server-x86_64-unknown-linux-gnu \
            wit-language-server-x86_64-pc-windows-msvc.exe
          do
            if ! grep -Fxq "$asset" <<<"$assets"; then
              echo "::error::Required LSP release $SERVER_TAG is missing $asset"
              exit 1
            fi
            if ! grep -Fxq "$asset.sha256" <<<"$assets"; then
              echo "::error::Required LSP release $SERVER_TAG is missing $asset.sha256"
              exit 1
            fi
          done

      - run: cargo test -p xtask --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked

      - name: Run doctests
        run: cargo test --doc --workspace --exclude xtask --locked

  build_extension:
    name: Build Zed extension
    if: ${{ inputs.scope == 'extension' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-extension
          cache-bin: false
          save-if: false

      - name: Build the Zed extension as Zed does
        run: cargo build --target wasm32-wasip2 --locked

  build_lsp:
    name: Build LSP / ${{ matrix.target }}
    if: ${{ inputs.scope == 'lsp' }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      WIT_LANGUAGE_SERVER_BUILD_COMMIT: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          cache-bin: false
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.146
          fallback: none

      - name: Run native tests
        run: cargo nextest run --workspace --exclude xtask --locked --target "$TARGET"

      - name: Build native language server
        run: cargo build -p wit-language-server --release --locked --target "$TARGET"

      - name: Package release asset
        run: cargo xtask package-release --target "$TARGET" --output dist

      - name: Collect target redistribution notices
        run: cargo xtask collect-licenses --target "$TARGET" --output dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  verify_lsp:
    name: Verify LSP release artifact set
    if: ${{ inputs.scope == 'lsp' }}
    needs: [validate, build_lsp]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - run: cargo xtask verify-release-assets --input dist

  publish:
    name: Publish GitHub release
    if: >-
      ${{
        inputs.publish &&
        always() &&
        needs.validate.result == 'success' &&
        (
          (
            inputs.scope == 'lsp' &&
            needs.build_lsp.result == 'success' &&
            needs.verify_lsp.result == 'success'
          ) ||
          (
            inputs.scope == 'extension' &&
            needs.build_extension.result == 'success'
          )
        )
      }}
    needs: [validate, build_extension, build_lsp, verify_lsp]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.scope == 'lsp' }}
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Install pinned toolchain
        if: ${{ inputs.scope == 'lsp' }}
        run: rustup toolchain install

      - name: Verify complete LSP asset set
        if: ${{ inputs.scope == 'lsp' }}
        run: cargo xtask verify-release-assets --input dist

      - name: Attest LSP release artifacts
        if: ${{ inputs.scope == 'lsp' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_SCOPE: ${{ needs.validate.outputs.scope }}
          RELEASE_TITLE: ${{ needs.validate.outputs.title }}
          RELEASE_NOTES: ${{ needs.validate.outputs.notes }}
        run: |
          set -euo pipefail

          if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$RELEASE_SHA" >/dev/null
          fi

          remote_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          object_type=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          if [ "$object_type" = "tag" ]; then
            remote_sha=$(gh api "repos/$GH_REPO/git/tags/$remote_sha" --jq '.object.sha')
          fi
          if [ "$remote_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG resolves to $remote_sha instead of $RELEASE_SHA"
            exit 1
          fi

          case "$RELEASE_SCOPE" in
            lsp)
              scope_marker="Release scope: LSP only"
              scope_notice="> **Release scope: LSP only.** This GitHub release publishes the native WIT language server and its release metadata. It does not publish the WIT Zed extension or change the Zed extension registry."
              ;;
            extension)
              scope_marker="Release scope: Zed extension only"
              scope_notice="> **Release scope: Zed extension only.** This GitHub release represents the WIT Zed extension source at this tag. It does not publish native LSP binaries and does not update the Zed extension registry."
              ;;
            *)
              echo "::error::Unsupported release scope: $RELEASE_SCOPE"
              exit 1
              ;;
          esac

          if draft_json=$(gh release view "$RELEASE_TAG" --json isDraft,name,body 2>/dev/null); then
            if [ "$(jq -r '.isDraft' <<<"$draft_json")" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published"
              exit 1
            fi
            if [ "$(jq -r '.name' <<<"$draft_json")" != "$RELEASE_TITLE" ]; then
              echo "::error::Draft $RELEASE_TAG has a different release scope/title"
              exit 1
            fi
            if ! jq -r '.body' <<<"$draft_json" | grep -Fq "$scope_marker"; then
              echo "::error::Draft $RELEASE_TAG does not contain the expected scope marker"
              exit 1
            fi
          else
            composed_notes="$RUNNER_TEMP/release-notes.md"
            printf '%s\n\n' "$scope_notice" >"$composed_notes"
            cat "$RELEASE_NOTES" >>"$composed_notes"

            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TITLE" \
              --notes-file "$composed_notes"

            release_ready=false
            for _ in {1..10}; do
              if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                release_ready=true
                break
              fi
              sleep 1
            done
            if [ "$release_ready" != "true" ]; then
              echo "::error::Draft release $RELEASE_TAG did not become visible"
              exit 1
            fi
          fi

      - name: Upload LSP release assets
        if: ${{ inputs.scope == 'lsp' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            dist/* \
            LICENSE-MIT \
            LICENSE-APACHE \
            THIRD_PARTY_NOTICES.md \
            --clobber

      - name: Verify draft asset scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SCOPE: ${{ needs.validate.outputs.scope }}
        run: |
          set -euo pipefail

          release_json=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")
          assets=$(jq -r '.assets[].name' <<<"$release_json")
          asset_count=$(jq '.assets | length' <<<"$release_json")

          case "$RELEASE_SCOPE" in
            extension)
              if [ "$asset_count" -ne 0 ]; then
                echo "::error::Extension release $RELEASE_TAG must not contain attached assets"
                exit 1
              fi
              ;;
            lsp)
              if [ "$asset_count" -ne 23 ]; then
                echo "::error::LSP release $RELEASE_TAG must contain exactly 23 assets; found $asset_count"
                exit 1
              fi

              for asset in LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md; do
                if ! grep -Fxq "$asset" <<<"$assets"; then
                  echo "::error::LSP release $RELEASE_TAG is missing $asset"
                  exit 1
                fi
              done

              for binary in \
                wit-language-server-aarch64-apple-darwin \
                wit-language-server-x86_64-apple-darwin \
                wit-language-server-aarch64-unknown-linux-gnu \
                wit-language-server-x86_64-unknown-linux-gnu \
                wit-language-server-x86_64-pc-windows-msvc.exe
              do
                for asset in "$binary" "$binary.sha256" "$binary.provenance.json" "$binary.licenses.txt"; do
                  if ! grep -Fxq "$asset" <<<"$assets"; then
                    echo "::error::LSP release $RELEASE_TAG is missing $asset"
                    exit 1
                  fi
                done
              done
              ;;
            *)
              echo "::error::Unsupported release scope: $RELEASE_SCOPE"
              exit 1
              ;;
          esac

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SCOPE: ${{ needs.validate.outputs.scope }}
          RELEASE_TITLE: ${{ needs.validate.outputs.title }}
        run: |
          set -euo pipefail

          case "$RELEASE_SCOPE" in
            lsp) scope_marker="Release scope: LSP only" ;;
            extension) scope_marker="Release scope: Zed extension only" ;;
            *)
              echo "::error::Unsupported release scope: $RELEASE_SCOPE"
              exit 1
              ;;
          esac

          release_json=$(gh release view "$RELEASE_TAG" --json isDraft,tagName,name,body)
          test "$(jq -r '.isDraft' <<<"$release_json")" = "false"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.name' <<<"$release_json")" = "$RELEASE_TITLE"
          jq -r '.body' <<<"$release_json" | grep -Fq "$scope_marker"

          published_json=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")
          case "$RELEASE_SCOPE" in
            extension) test "$(jq '.assets | length' <<<"$published_json")" -eq 0 ;;
            lsp) test "$(jq '.assets | length' <<<"$published_json")" -eq 23 ;;
          esac
