name: Release native server
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag at the default branch dispatch commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-native-server
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate versions and immutable source
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Expected stable SemVer tag vX.Y.Z')
          root = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          native = tomllib.loads(pathlib.Path('crates/wit-language-server/Cargo.toml').read_text())
          extension = tomllib.loads(pathlib.Path('extension.toml').read_text())
          if {root['package']['version'], native['package']['version'], extension['version']} != {tag[1:]}:
              raise SystemExit('Tag and adapter/server/extension versions must agree')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          if tagged != sha or sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Tag must point to the default branch dispatch commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\ntag={tag}\n')
          PY
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked
      - name: Check only the Zed adapter for Wasm
        run: cargo check -p zed-wit --target wasm32-wasip2 --locked
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - run: cargo test --workspace --locked --target "$TARGET"
      - run: cargo build -p wit-language-server --release --locked --target "$TARGET"
      - run: python3 scripts/package-release.py --target "$TARGET" --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          targets = ['aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'x86_64-pc-windows-msvc']
          expected = set()
          for target in targets:
              name = 'wit-language-server-' + target + ('.exe' if 'windows' in target else '')
              expected.update([name, name + '.sha256', name + '.provenance.json'])
              asset = pathlib.Path('dist') / name
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              if not asset.stat().st_size:
                  raise SystemExit(f'Empty asset: {name}')
              if asset.with_name(name + '.sha256').read_text() != f'{digest}  {name}\n':
                  raise SystemExit(f'Invalid checksum: {name}')
          actual = {item.name for item in pathlib.Path('dist').iterdir()}
          if actual != expected:
              raise SystemExit('Release artifact set does not match five complete targets')
          for item in pathlib.Path('dist').iterdir():
              if item.is_symlink() or not item.is_file() or not item.stat().st_size:
                  raise SystemExit(f'Invalid release artifact: {item}')
          PY
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          remote_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          object_type=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          if [ "$object_type" = tag ]; then
            remote_sha=$(gh api "repos/$GH_REPO/git/tags/$remote_sha" --jq '.object.sha')
          fi
          test "$remote_sha" = "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" dist/* LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md --verify-tag --title "$RELEASE_TAG" --generate-notes
