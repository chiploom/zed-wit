name: CI
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - ".github/licenses/**"
      - "THIRD_PARTY_NOTICES.md"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/dependabot.yml"
      - "!.editorconfig"
      - "!.gitignore"
  pull_request: {}
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_AUTO_INSTALL: "0"
  WIT_LANGUAGE_SERVER_BUILD_COMMIT: ${{ github.sha }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Pull-request caches are isolated to refs/pull/*/merge and cannot write to main's cache scope.
      - name: Restore/save Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: quality
          cache-bin: false
      - run: cargo xtask check-no-python
      - run: cargo xtask check-dependencies
      - run: cargo test -p xtask --locked
      - name: Stress disposable Git cleanup across concurrent test processes
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for worker in {1..4}; do
            (
              for iteration in {1..12}; do
                cargo test -p xtask --locked --quiet \
                  disposable_git_rejects_unreviewed_source_after_squash_release
              done
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
      - name: Exercise protected-CD asset integrity with offline mocked GitHub
        run: cargo xtask test-publish
      - name: Exercise real publishing CLI in a disposable Git and Cargo checkout
        run: bash scripts/test-publish-cli-process.sh
      - name: Run 2,000-iteration benchmark
        run: cargo xtask bench --iterations 2000
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked
      - name: Run doctests
        run: cargo test --doc --workspace --exclude xtask --locked
      - name: Build the Zed extension as Zed does
        run: cargo build --target wasm32-wasip2 --locked
      - name: Verify working tree remains clean
        run: |
          git diff --check
          test -z "$(git status --short)"

  registry-compatibility:
    name: Zed registry compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zed registry Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-wasip2
      - name: Verify Zed registry Rust toolchain
        run: |
          rustc --version
          rustc --version | grep -E '^rustc 1\.90\.0 '
      - name: Build Zed extension adapter with Rust 1.90
        run: cargo build --release --locked --package zed-wit --target wasm32-wasip2

  native-tests:
    name: Tests / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            gui_feature: native
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            gui_feature: linux-x11
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            gui_feature: native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Restore/save Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.target }}
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.146
          fallback: none
      - name: Check platform-specific xtask
        run: cargo check -p xtask --all-targets --locked --target "$TARGET"
      - name: Clippy platform GUI input backend
        run: cargo clippy -p zed-gui-input --all-targets --locked --no-default-features --features "${{ matrix.gui_feature }}" --target "$TARGET" -- -D warnings
      - name: Clippy Linux Wayland GUI input backends
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p zed-gui-input --all-targets --locked --no-default-features --features linux-wayland --target "$TARGET" -- -D warnings
          cargo clippy -p zed-gui-input --all-targets --locked --no-default-features --features linux-libei --target "$TARGET" -- -D warnings
      - name: Run native tests
        run: cargo nextest run --workspace --exclude xtask --locked --target "$TARGET"

  portability:
    name: Check / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            gui_feature: native
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            gui_feature: linux-x11
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Restore/save Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check-${{ matrix.target }}
          cache-bin: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.146
          fallback: none
      - name: Check native target
        run: cargo check --workspace --exclude xtask --all-targets --locked --target "$TARGET"
      - name: Check platform-specific xtask
        run: cargo check -p xtask --all-targets --locked --target "$TARGET"
      - name: Clippy platform GUI input backend
        run: cargo clippy -p zed-gui-input --all-targets --locked --no-default-features --features "${{ matrix.gui_feature }}" --target "$TARGET" -- -D warnings
      - name: Clippy Linux Wayland GUI input backends
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p zed-gui-input --all-targets --locked --no-default-features --features linux-wayland --target "$TARGET" -- -D warnings
          cargo clippy -p zed-gui-input --all-targets --locked --no-default-features --features linux-libei --target "$TARGET" -- -D warnings
      - name: Run native tests
        run: cargo nextest run --workspace --exclude xtask --locked --target "$TARGET"

  native-artifacts:
    name: Artifact / ${{ matrix.target }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Restore/save Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          cache-bin: false
      - run: cargo build -p wit-language-server --release --locked --target "$TARGET"
      - run: cargo xtask package-release --target "$TARGET" --output dist
      - run: cargo xtask collect-licenses --target "$TARGET" --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify-native-artifacts:
    name: Verify native artifact set
    needs: native-artifacts
    cache-mode: none
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - run: cargo xtask verify-release-assets --input dist
