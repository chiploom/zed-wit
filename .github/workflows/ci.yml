name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTUP_AUTO_INSTALL: "0"
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo xtask check-no-python
      - run: cargo xtask check-dependencies
      - run: cargo test -p xtask --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked
      - name: Check only the Zed adapter for Wasm
        run: cargo check -p zed-wit --target wasm32-wasip2 --locked
  native:
    name: Native / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --workspace --exclude xtask --locked --target "$TARGET"
      - run: cargo build -p wit-language-server --release --locked --target "$TARGET"
      - run: cargo xtask package-release --target "$TARGET" --output dist
      - run: cargo xtask collect-licenses --target "$TARGET" --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify-native-artifacts:
    name: Verify native artifact set
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - run: cargo xtask verify-release-assets --input dist
